services:
  postgres:
    image: postgres:alpine
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 1234567
      POSTGRES_DB: db
      PGDATA: /var/lib/postgresql/data/pgdata

  web:
    build:
      context: .
      target: Backend
    ports:
      - 8000:8000
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - postgres
    volumes:
      - ./media:/app/media

  nginx:
    build:
      context: .
      target: Nginx
    
    ports:
      - 80:80
    volumes:
      - ./media:/media
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  pgdata: